short_bio: >-
  <p>
    I am a Research Associate in Aerospace Engineering at the University of Bristol, affiliated with the Bristol Composites Institute, where I recently completed my PhD. I work on hard engineering problems that refuse to stay in a single discipline &mdash; where geometry, materials, manufacturing, and structural performance are tightly coupled and cannot be optimised in isolation. My research on filament-wound composite joints for modular truss structures sits exactly at that intersection, targeting lightweight aerospace systems.
  </p>
  <p>
    I am drawn to problems with many interacting dimensions and a large design space, and I enjoy reframing them so they become tractable. A central example is my work on automated three-dimensional filament winding path planning, where I extended graph-theoretical methods to simultaneously satisfy spatial constraints, fibre continuity, and manufacturability &mdash; turning what had been a manual, trial-and-error craft into a systematic, computationally driven design process.
  </p>
  <p>
    My strength lies in moving fluidly across the full engineering workflow and connecting the pieces: CAD and geometric modelling, nonlinear finite element analysis, structural optimisation, bespoke winding-rig and equipment design, and experimental validation through mechanical testing. I combine computational modelling with hands-on manufacturing and characterisation, so that analysis, fabrication, and physical evidence inform one another. More broadly, my interests span continuous-fibre composite processes, analysis-driven design, and optimisation for lightweight structures.
  </p>

