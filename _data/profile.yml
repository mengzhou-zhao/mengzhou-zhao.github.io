short_bio: >-
  <p>
    I am a Research Associate at the University of Bristol, where I also completed my PhD in Aerospace Engineering at the Bristol Composites Institute. I design <strong>lightweight structures</strong>: my job is to turn aerodynamic and kinematic requirements into structures that can actually be manufactured, validated, and loaded. I am building towards eVTOL and the low-altitude economy, commercial space, and intelligent robotics.
  </p>
  <p>
    My work sits where geometry, materials, manufacturing, and structural performance are tightly coupled and cannot be optimised in isolation &mdash; structural mechanics, composite processing, mechanism kinematics, algorithm development, and mechanical testing. I am used to running that loop end to end on my own, from defining the requirement to validating it on a rig, and the equipment and tooling I need are usually ones I have built and commissioned myself. Conclusions that matter get checked against physical data: simulation is where the work starts, not where it stops.
  </p>
  <p>
    I also prefer to replace repetitive manual work with algorithms and automation &mdash; parametric modelling, optimisation, and AI agents taking over the repeated steps in modelling, simulation, and data handling. The point is not personal speed but a reusable digital workflow that shortens the design iteration cycle for the whole team, with the engineering judgement staying human.
  </p>
  <p>
    A recurring theme in my work is taking on tasks that have stalled and carrying them through to something real. The projects below record how that has gone.
  </p>

# Chinese version of the bio shown when the site is in Chinese mode.
short_bio_zh: >-
  <p>
    我是赵梦舟，英国布里斯托大学（University of Bristol）航空航天工程博士，毕业于布里斯托复合材料研究院，目前在该校任研究员（博士后）。我做的是<strong>轻量化结构设计</strong>：把气动与运动需求，翻译成造得出来、验得了、扛得住载荷的结构方案。面向低空经济 / eVTOL、商业航天与智能机器人等先进装备领域。
  </p>
  <p>
    我处理的问题通常无法被单一学科框定——几何、材料、制造工艺与结构性能彼此紧密耦合，无法孤立地各自优化。工作横跨结构力学、复合材料工艺、机构运动学、算法开发与实验测试，我习惯独立走完从需求定义到实验验证的全流程；所需的设备、工装与试验台架多由本人搭建与调试，关键结论都经过实测校核。仿真是工作的起点，而不是终点。
  </p>
  <p>
    我也习惯用算法与自动化替代重复人工：以参数化建模、优化算法与 AI Agent 承担建模、仿真与数据处理中的重复环节。目的不是个人手速，而是把它沉淀为可复用的数字化研发流程，缩短团队的方案迭代周期——工程判断与方案决策仍由人主导。
  </p>
  <p>
    我做结构追求"更轻、更强、可制造"，而非纸面最优解；接手的任务不论是否属于原定职责，都会推进到能落地的状态。下面的项目记录了这些工作的具体过程与结果。
  </p>

